##
## p2p_supplicant.conf —— Wi-Fi Direct（P2P）的 supplicant 設定
##
## 為什麼要自己補：
##   ASUS 的 /vendor/etc/init/hw/init.qcom.rc 定義的 wpa_supplicant 服務是
##   Oreo 形式，用 -c 指定設定檔：
##       service wpa_supplicant /vendor/bin/hw/wpa_supplicant \
##           -ip2p0 -Dnl80211 -c/data/misc/wifi/p2p_supplicant.conf \
##           -iwlan0 -Dnl80211 -c/data/misc/wifi/wpa_supplicant.conf ...
##   在 Oreo，那兩份是由框架從範本複製到 /data/misc/wifi 的；
##   Android 9 改成用 HIDL 設定 supplicant，不再做這個複製，於是檔案永遠不存在：
##       wpa_supplicant: Failed to open config file '/data/misc/wifi/p2p_supplicant.conf'
##       SupplicantStaIfaceHal: Failed to get ISupplicant
##       WifiNative: Failed to connect to supplicant
##
##   而且原廠 /vendor/etc/wifi/ 裡只有 wpa_supplicant.conf 與兩個 overlay，
##   連 p2p_supplicant.conf 的範本都沒有（Oreo 是框架生成的）。
##
##   所以這份自己寫，再由 rootdir/etc/init.z01g.rc 在 post-fs-data 複製到
##   /data/misc/wifi/。實際的細項設定由原廠的
##   /vendor/etc/wifi/p2p_supplicant_overlay.conf 疊上去（服務用 -I 指定）：
##       disable_scan_offload=1
##       p2p_no_group_iface=1
##       persistent_reconnect=1
##
## 內容取自 AOSP 的標準 p2p_supplicant.conf。
##
update_config=1
device_name=Android_ZS551KL
manufacturer=ASUSTeK
model_name=ASUS_Z01GD
model_number=ZS551KL
device_type=10-0050F204-5
config_methods=virtual_push_button physical_display keypad
p2p_no_group_iface=1
